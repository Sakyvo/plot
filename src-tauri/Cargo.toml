[package]
name = "plot"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = true, features = ["json"] }
engine = { path = "../engine" }

[dev-dependencies]
tempfile = "3.27.0"
