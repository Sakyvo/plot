[package]
name = "engine"
version = "1.0.0"
edition = "2021"

[dependencies]
rayon = "1"
encoding_rs = "0.8.35"
serde = { version = "1", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

serde_json = "1"

[dev-dependencies]
crc32fast = "1.5.0"
encoding_rs = "0.8.35"
serde_json = "1"
tempfile = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
